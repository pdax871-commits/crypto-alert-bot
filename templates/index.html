<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Alert Dashboard</title>
    <script src="https://unpkg.com/lightweight-charts@3.8.0/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        :root {
            --bg-color: #131722;
            --text-color: #d1d4dc;
            --card-bg: #1e222d;
            --border-color: #2a2e39;
        }
        body.light-theme {
            --bg-color: #ffffff;
            --text-color: #131722;
            --card-bg: #f0f3fa;
            --border-color: #e0e3eb;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        html, body { width: 100%; height: 100%; overflow: hidden; background-color: var(--bg-color); color: var(--text-color); }
        
        header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); height: 60px; }
        .top-left, .top-right, .top-center { display: flex; align-items: center; gap: 12px; }
        
        .status-btn { padding: 8px 16px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; color: white; transition: 0.3s; }
        .status-btn.active { background-color: #0ecb81; }
        .status-btn.inactive { background-color: #f6465d; }

        .action-btn { padding: 8px 16px; font-weight: bold; border-radius: 4px; border: 1px solid var(--border-color); background-color: var(--card-bg); color: var(--text-color); cursor: pointer; }

        select, button, input { padding: 8px 12px; background-color: var(--bg-color); color: var(--text-color); border: 1px solid var(--border-color); border-radius: 4px; }
        
        .main-container { width: 100vw; height: calc(100vh - 60px); position: relative; display: block; }
        #chart { width: 100%; height: 100%; display: block; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.6); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-content { background-color: var(--card-bg); width: 420px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        .modal-body { overflow-y: auto; display: flex; flex-direction: column; gap: 12px; max-height: 50vh; }
        
        .alert-card { background-color: var(--bg-color); padding: 12px; border-radius: 6px; border: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .alert-card .del-btn { background-color: #f6465d; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }

        #context-menu { position: absolute; display: none; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 4px; z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        #context-menu button { display: block; width: 100%; border: none; text-align: left; padding: 10px 15px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="top-left">
            <select id="symbol-select" onchange="loadChartData(true)">
                <option value="BTCUSDT">BTC/USDT</option>
                <option value="ETHUSDT">ETH/USDT</option>
                <option value="SOLUSDT">SOL/USDT</option>
                <option value="BNBUSDT">BNB/USDT</option>
            </select>
            
            <select id="tf-select" onchange="changeTF(this.value)">
                <option value="1m">1m</option>
                <option value="5m">5m</option>
                <option value="15m" selected>15m</option>
                <option value="1h">1h</option>
                <option value="4h">4h</option>
            </select>
        </div>

        <div class="top-center">
            <button id="ema-9-20-btn" class="status-btn inactive" onclick="toggleAlertState('ema_9_20')">9-20 EMA Cross Alert</button>
            <button id="ema-200-btn" class="status-btn inactive" onclick="toggleAlertState('ema_200')">200 EMA Touch Alert</button>
        </div>

        <div class="top-right">
            <button class="action-btn" onclick="openAlertsModal()">🔔 Active Alerts</button>
            <button onclick="toggleTheme()">Theme 🌗</button>
        </div>
    </header>

    <div class="main-container">
        <div id="chart"></div>
        <div id="context-menu">
            <button onclick="openAddAlertModal()">➕ Set Horizontal Alert Here</button>
        </div>
    </div>

    <!-- Active Alerts List Modal -->
    <div id="alerts-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Active Horizontal Alerts</h3>
                <button onclick="closeModal('alerts-modal')" style="padding: 2px 8px; border:none; cursor:pointer;">✕</button>
            </div>
            <div id="modal-alerts-list" class="modal-body"></div>
            <div style="margin-top: 15px; text-align: right;">
                <button onclick="clearAllAlerts()" style="background-color: #f6465d; color: white; border:none; cursor:pointer;">Clear All Alerts</button>
            </div>
        </div>
    </div>

    <!-- Add Alert UI Modal -->
    <div id="add-alert-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Create Horizontal Alert</h3>
                <button onclick="closeModal('add-alert-modal')" style="padding: 2px 8px; border:none; cursor:pointer;">✕</button>
            </div>
            <div class="modal-body">
                <label>Price Level:</label>
                <input type="text" id="alert-price-input" readonly />
                <label>Custom Message:</label>
                <input type="text" id="alert-msg-input" placeholder="e.g. Resistance Reached" value="Target Level Reached" />
            </div>
            <div style="margin-top: 15px; display:flex; justify-content: flex-end; gap: 10px;">
                <button onclick="closeModal('add-alert-modal')">Cancel</button>
                <button onclick="submitAddAlert()" style="background-color: #0ecb81; color: white; border:none;">Set Alert</button>
            </div>
        </div>
    </div>

    <!-- Confirm Delete Modal (Triggered when left clicking a line) -->
    <div id="confirm-delete-modal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Delete Alert</h3>
                <button onclick="closeModal('confirm-delete-modal')" style="padding: 2px 8px; border:none; cursor:pointer;">✕</button>
            </div>
            <div class="modal-body">
                <p id="delete-alert-text">Do you want to delete this alert?</p>
            </div>
            <div style="margin-top: 15px; display:flex; justify-content: flex-end; gap: 10px;">
                <button onclick="closeModal('confirm-delete-modal')">Cancel</button>
                <button id="confirm-delete-btn" style="background-color: #f6465d; color: white; border:none;">Delete</button>
            </div>
        </div>
    </div>

    <script>
        let currentSymbol = "BTCUSDT";
        let currentTF = "15m";
        let chart, candlestickSeries, ema9Series, ema20Series, ema200Series;
        let clickedPrice = null;
        let activeAlerts = [];
        let priceLineMap = {};
        let isDark = true;
        let isFirstLoad = true;

        // Persist EMA States using localStorage
        let isEma920Active = localStorage.getItem('isEma920Active') === 'true';
        let isEma200Active = localStorage.getItem('isEma200Active') === 'true';
        let lastEma200TouchedTime = 0;

        function toggleTheme() {
            isDark = !isDark;
            document.body.classList.toggle('light-theme', !isDark);
            chart.applyOptions({
                layout: {
                    backgroundColor: isDark ? '#131722' : '#ffffff',
                    textColor: isDark ? '#d1d4dc' : '#131722',
                },
                grid: {
                    vertLines: { color: isDark ? '#2a2e39' : '#e0e3eb' },
                    horzLines: { color: isDark ? '#2a2e39' : '#e0e3eb' },
                }
            });
        }

        function calculateEMA(candles, period) {
            if (!candles || candles.length < period) return [];
            let k = 2 / (period + 1);
            let emaData = [];
            let ema = candles[0].close;

            for (let i = 0; i < candles.length; i++) {
                if (i === 0) {
                    ema = candles[i].close;
                } else {
                    ema = (candles[i].close * k) + (ema * (1 - k));
                }
                if (i >= period - 1) {
                    emaData.push({ time: candles[i].time, value: ema });
                }
            }
            return emaData;
        }

        function initChart() {
            const container = document.getElementById('chart');
            const w = container.clientWidth || window.innerWidth;
            const h = container.clientHeight || (window.innerHeight - 60);

            chart = LightweightCharts.createChart(container, {
                width: w,
                height: h,
                layout: { backgroundColor: '#131722', textColor: '#d1d4dc' },
                grid: { vertLines: { color: '#2a2e39' }, horzLines: { color: '#2a2e39' } },
                crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
                timeScale: { timeVisible: true, secondsVisible: false }
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#0ecb81', downColor: '#f6465d', borderVisible: false, wickUpColor: '#0ecb81', wickDownColor: '#f6465d'
            });

            ema9Series = chart.addLineSeries({ color: '#2962ff', lineWidth: 1, title: 'EMA 9' });
            ema20Series = chart.addLineSeries({ color: '#ff9800', lineWidth: 1, title: 'EMA 20' });
            ema200Series = chart.addLineSeries({ color: '#e91e63', lineWidth: 2, title: 'EMA 200' });

            window.addEventListener('resize', () => {
                chart.applyOptions({
                    width: container.clientWidth || window.innerWidth,
                    height: container.clientHeight || (window.innerHeight - 60)
                });
            });

            container.addEventListener('contextmenu', function (e) {
                e.preventDefault();
                const menu = document.getElementById('context-menu');
                menu.style.display = 'block';
                menu.style.left = e.clientX + 'px';
                menu.style.top = e.clientY + 'px';
                
                try {
                    const coord = candlestickSeries.coordinateToPrice(e.offsetY);
                    clickedPrice = coord ? coord.toFixed(4) : null;
                } catch (err) {
                    clickedPrice = null;
                }
            });

            // Strict Line Click Delete Detection (Shows Confirmation Modal First)
            chart.subscribeClick((param) => {
                if (!param.point || !activeAlerts || activeAlerts.length === 0) return;

                const clickedChartPrice = candlestickSeries.coordinateToPrice(param.point.y);
                if (!clickedChartPrice) return;

                // Precision threshold (0.05%) to avoid accidental clicks from distance
                const matchedAlert = activeAlerts.find(a => {
                    return a.symbol.toUpperCase() === currentSymbol.toUpperCase() && 
                           Math.abs(parseFloat(a.price) - clickedChartPrice) / parseFloat(a.price) < 0.0005;
                });

                if (matchedAlert) {
                    promptDeleteAlert(matchedAlert.symbol, matchedAlert.price);
                }
            });

            document.addEventListener('click', () => {
                document.getElementById('context-menu').style.display = 'none';
            });
        }

        async function loadChartData(resetZoom = false) {
            currentSymbol = document.getElementById('symbol-select').value;

            try {
                const res = await fetch(`/api/klines?symbol=${currentSymbol}&interval=${currentTF}`);
                const data = await res.json();

                if (Array.isArray(data) && data.length > 0) {
                    let candles = [];
                    for (let c of data) {
                        candles.push({
                            time: Math.floor(c[0] / 1000),
                            open: parseFloat(c[1]),
                            high: parseFloat(c[2]),
                            low: parseFloat(c[3]),
                            close: parseFloat(c[4])
                        });
                    }

                    candlestickSeries.setData(candles);

                    const ema9 = calculateEMA(candles, 9);
                    const ema20 = calculateEMA(candles, 20);
                    const ema200 = calculateEMA(candles, 200);

                    ema9Series.setData(ema9);
                    ema20Series.setData(ema20);
                    ema200Series.setData(ema200);

                    if (isFirstLoad || resetZoom) {
                        chart.timeScale().fitContent();
                        isFirstLoad = false;
                    }

                    checkTechnicalAlerts(candles, ema9, ema20, ema200);
                }
            } catch (e) {
                console.error("Fetch Error:", e);
            }

            refreshPriceLines();
        }

        function checkTechnicalAlerts(candles, ema9, ema20, ema200) {
            if (candles.length < 2 || ema9.length < 2 || ema20.length < 2 || ema200.length < 1) return;

            const lastIndex = candles.length - 1;
            const currCandle = candles[lastIndex];
            const currEma9 = ema9[ema9.length - 1].value;
            const currEma20 = ema20[ema20.length - 1].value;
            const prevEma9 = ema9[ema9.length - 2].value;
            const prevEma20 = ema20[ema20.length - 2].value;
            const currEma200 = ema200[ema200.length - 1].value;

            if (isEma920Active) {
                if (prevEma9 <= prevEma20 && currEma9 > currEma20) {
                    triggerInstantAlert(currentSymbol, currCandle.close, `🚨 9-20 EMA BULLISH CROSSOVER (${currentTF})`);
                } else if (prevEma9 >= prevEma20 && currEma9 < currEma20) {
                    triggerInstantAlert(currentSymbol, currCandle.close, `⚠️ 9-20 EMA BEARISH CROSSOVER (${currentTF})`);
                }
            }

            if (isEma200Active) {
                if (currCandle.low <= currEma200 && currCandle.high >= currEma200) {
                    if (currCandle.time !== lastEma200TouchedTime) {
                        lastEma200TouchedTime = currCandle.time;
                        triggerInstantAlert(currentSymbol, currCandle.close, `🎯 PRICE TOUCHED 200 EMA (${currentTF})`);
                    }
                }
            }
        }

        async function triggerInstantAlert(symbol, price, message) {
            await fetch('/api/trigger_alert', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbol: symbol, price: price, message: message })
            });
        }

        function changeTF(tf) {
            currentTF = tf;
            loadChartData(true);
        }

        function toggleAlertState(type) {
            if (type === 'ema_9_20') {
                isEma920Active = !isEma920Active;
                localStorage.setItem('isEma920Active', isEma920Active);
                updateButtonUI(document.getElementById('ema-9-20-btn'), isEma920Active);
            } else if (type === 'ema_200') {
                isEma200Active = !isEma200Active;
                localStorage.setItem('isEma200Active', isEma200Active);
                updateButtonUI(document.getElementById('ema-200-btn'), isEma200Active);
            }
        }

        function updateButtonUI(btn, status) {
            if (status) {
                btn.classList.remove('inactive');
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
                btn.classList.add('inactive');
            }
        }

        function openAddAlertModal() {
            if (!clickedPrice) return;
            document.getElementById('alert-price-input').value = clickedPrice;
            document.getElementById('add-alert-modal').style.display = 'flex';
        }

        async function submitAddAlert() {
            const price = parseFloat(document.getElementById('alert-price-input').value);
            const msg = document.getElementById('alert-msg-input').value || "Target Level Reached";

            await fetch('/api/add_alert', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbol: currentSymbol, price: price, message: msg })
            });

            closeModal('add-alert-modal');
            fetchServerAlerts();
        }

        // Silent Delete Modal Prompt
        function promptDeleteAlert(symbol, price) {
            document.getElementById('delete-alert-text').innerText = `Delete alert for ${symbol} at $${price}?`;
            const confirmBtn = document.getElementById('confirm-delete-btn');
            confirmBtn.onclick = async () => {
                await deleteSingleAlert(symbol, price);
                closeModal('confirm-delete-modal');
            };
            document.getElementById('confirm-delete-modal').style.display = 'flex';
        }

        // Silent Delete Action (Calls /api/delete_alert instead of trigger)
        async function deleteSingleAlert(symbol, price) {
            await fetch('/api/delete_alert', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ symbol: symbol, price: price })
            });
            fetchServerAlerts();
        }

        async function clearAllAlerts() {
            await fetch('/api/clear_alerts', { method: 'POST' });
            closeModal('alerts-modal');
            fetchServerAlerts();
        }

        function openAlertsModal() {
            document.getElementById('alerts-modal').style.display = 'flex';
        }

        function closeModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        async function fetchServerAlerts() {
            try {
                const res = await fetch('/api/get_alerts');
                activeAlerts = await res.json();

                const modalAlertsContainer = document.getElementById('modal-alerts-list');
                modalAlertsContainer.innerHTML = '';

                if (!activeAlerts || activeAlerts.length === 0) {
                    modalAlertsContainer.innerHTML = '<p style="text-align: center; opacity: 0.6;">No Active Alerts</p>';
                } else {
                    activeAlerts.forEach(alert => {
                        const item = document.createElement('div');
                        item.className = 'alert-card';
                        item.innerHTML = `
                            <div>
                                <strong>${alert.symbol.toUpperCase()}</strong> @ $${parseFloat(alert.price).toFixed(4)}<br/>
                                <small>${alert.message || 'Level Reached'}</small>
                            </div>
                            <button class="del-btn" onclick="promptDeleteAlert('${alert.symbol}', ${alert.price})">Delete</button>
                        `;
                        modalAlertsContainer.appendChild(item);
                    });
                }

                refreshPriceLines();
            } catch (e) {
                console.error("Error fetching alerts:", e);
            }
        }

        function refreshPriceLines() {
            Object.values(priceLineMap).forEach(line => {
                try { candlestickSeries.removePriceLine(line); } catch(e){}
            });
            priceLineMap = {};

            if (activeAlerts && activeAlerts.length > 0) {
                activeAlerts.forEach((alert, idx) => {
                    if (alert.symbol.toUpperCase() === currentSymbol.toUpperCase()) {
                        const line = candlestickSeries.createPriceLine({
                            price: parseFloat(alert.price),
                            color: '#ff9800',
                            lineWidth: 2,
                            lineStyle: LightweightCharts.LineStyle.Dashed,
                            axisLabelVisible: true,
                            title: alert.message || 'Alert Target',
                        });
                        priceLineMap[idx] = line;
                    }
                });
            }
        }

        window.onload = async () => {
            initChart();
            
            // Restore saved EMA button states
            updateButtonUI(document.getElementById('ema-9-20-btn'), isEma920Active);
            updateButtonUI(document.getElementById('ema-200-btn'), isEma200Active);

            await fetchServerAlerts();
            await loadChartData(true);
            
            setInterval(() => {
                loadChartData(false);
                fetchServerAlerts();
            }, 5000);
        };
    </script>
</body>
</html>
